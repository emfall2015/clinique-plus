services:
  angular-app:
    build:
      context: .
      dockerfile: ./Front/Dockerfile.dev

    container_name: angular-app

    ports:
      - "8081:8081"

    volumes:
      #  code local est directement visible dans /app
      - ./Front:/app

      # ne pas écraser node_modules
      - /app/node_modules

    restart: unless-stopped

    command: >
      npm start --
      --host 0.0.0.0
      --port 8081
      --poll 1000

  clinique-plus-api:
    build:
      context: .
      dockerfile: ./Back/Dockerfile
    image: clinique-plus-api
    container_name: clinique-plus-api
    ports:
      - "9002:3000"
    env_file:
      - ./Back/.env
    environment:
      DB_HOST: db-api
      DB_PORT: 3306
      PATH_ETL: python/main.py
      PATH_RESULT_NUIT_IA : python/base_analytique/angular_resultats_nuit_avec_ia.py
    depends_on:
      db-api:
        condition: service_healthy


  db-api:
    build:
      context: .
      dockerfile: ./mysql-docker/Dockerfile

    # Charge les identifiants depuis le .env à la racine
    env_file:
      - ./Back/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # Expose la db sur localhost:3305
    ports:
      - "3305:3306"
    # le dump initdb/ n'est rejoué que si le contenu de la db est vide
    volumes:
      - db_data:/var/lib/mysql
    # mysql -h 127.0.0.1 -P 3307 -u root -p clinique
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$DB_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
  python-service:
    container_name: python-service
    build:
      context: .
      dockerfile: ./python-service/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./python-service/.env
    volumes:
      - ./python-service:/app

volumes:
  db_data:

  


   